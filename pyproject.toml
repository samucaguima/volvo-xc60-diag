[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volvodiag"
version = "0.3.0"
description = "Diagnóstico somente leitura do Volvo XC60 (P3) com adaptador ELM327"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
volvodiag = "volvodiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volvodiag = ["data/*.csv", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
